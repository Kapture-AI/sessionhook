name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that the package contains the CLI
        run: |
          npm pack --dry-run --json | node --eval '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const listed = JSON.parse(input)[0].files.some((file) => file.path === "dist/cli.js");
              process.exit(listed ? 0 : 1);
            });
          '
